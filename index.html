    .toast.ok{border-color:rgba(16,185,129,.5);color:var(--green)}
    .toast.err{border-color:rgba(230,57,70,.5);color:var(--red)}
    .avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
    .av-opt{font-size:26px;text-align:center;padding:7px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:all .15s}
    .av-opt:hover,.av-opt.sel{border-color:var(--gold);background:rgba(255,215,0,.1)}
    .empty{text-align:center;padding:44px 24px;color:var(--text3)}
    .invite-box{background:rgba(255,215,0,.08);border:1px dashed rgba(255,215,0,.4);border-radius:12px;padding:14px;text-align:center;margin:12px 0}
    .invite-code{font-family:'Bebas Neue',cursive;font-size:32px;letter-spacing:6px;color:var(--gold)}
    .loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:2px;text-transform:uppercase}
    @keyframes slideUp{from{transform:translateX(-50%) translateY(16px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
    @keyframes fadeOut{from{opacity:1}to{opacity:0;pointer-events:none}}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite;display:inline-block}
    ::-webkit-scrollbar{width:3px;height:3px}
    ::-webkit-scrollbar-thumb{background:rgba(255,215,0,.3);border-radius:2px}
  </style>
</head>

// Convierte hora Mexico (CDT = UTC-5) a hora local del usuario
const toLocalTime = (dateStr, timeStr) => {
  // Los horarios en DB están en hora de México (CDT = UTC-5)
  const [h, m] = timeStr.split(":").map(Number);
  const utcDate = new Date(`${dateStr}T${timeStr}:00-05:00`);
  return utcDate;
};

const fmtLocalTime = (dateStr, timeStr) => {
  const d = toLocalTime(dateStr, timeStr);
  return d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit", timeZoneName: "short" });
};

const req = async (url, token, opts={}) => {
  const r = await fetch(url, {
    ...opts,
    headers: {"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":`Bearer ${token||SUPA_KEY}`,"Prefer":"return=representation",...(opts.headers||{})}
  });
  if(r.status===204) return [];
  return r.json();
};

const getWinner=(h,a,hs,as)=>hs>as?h:as>hs?a:"Empate";
const getOU=(hs,as)=>(hs+as)>2?"over":"under";
const calcPts=(pred,m)=>{
  if(m.home_score==null||!pred?.winner) return null;
  const cw=getWinner(m.home,m.away,m.home_score,m.away_score);
  const co=getOU(m.home_score,m.away_score);
  const hw=pred.winner===cw,ho=pred.over_under===co;
  return hw&&ho?3:hw||ho?1:0;
};
const fmtDate=d=>{
  if(!d) return "";
  try{ return new Date(d+"T12:00:00").toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"}); }catch(e){return d;}
};
const parseMatchDate=(dateStr,timeStr)=>{
  if(!dateStr) return new Date(0);
  // timeStr can be "13:00", "13:00:00", or null
  const t = (timeStr||"12:00").slice(0,5);
  try{ return new Date(`${dateStr}T${t}:00-05:00`); }catch(e){ return new Date(0); }
};
const isStarted=m=>{
  if(m.started) return true;
  return new Date() >= parseMatchDate(m.match_date, m.match_time);
};
const fmtLocalTime=(dateStr,timeStr)=>{
  try{
    const d = parseMatchDate(dateStr, timeStr);
    if(isNaN(d)) return timeStr||"";
    return d.toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",timeZoneName:"short"});
  }catch(e){ return timeStr||""; }
};

function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2600);return()=>clearTimeout(t)},[]);
  return <div className={`toast ${type==="error"?"err":"ok"}`}>{msg}</div>;
}

function MatchCard({match:m,userPred:pred,onPredict}){
  const started=isStarted(m);
  const pts=pred&&m.home_score!=null?calcPts(pred,m):null;
  return(
    <div className={`match-card${pred?" predicted":""}${started&&m.home_score==null?" locked":""}${pts===3?" pts3":pts===1?" pts1":""}`}>
      <div className="match-phase">
        <span>{m.match_group?`Grupo ${m.match_group}`:m.phase}</span>
        <span style={{fontSize:10,color:"var(--text3)"}}>{fmtDate(m.match_date)} · {fmtLocalTime(m.match_date, m.match_time||"00:00")}</span>
      </div>
      <div className="match-teams">
        <div className="team-side"><span className="team-flag">{FLAGS[m.home]||"🏳️"}</span><span className="team-name">{m.home}</span></div>
        {m.home_score!=null?<div className="match-result">{m.home_score} – {m.away_score}</div>:<span className="match-vs">VS</span>}
        <div className="team-side"><span className="team-flag">{FLAGS[m.away]||"🏳️"}</span><span className="team-name">{m.away}</span></div>
      </div>
      {pts!=null&&<div style={{marginBottom:8}}><span className={`pts-badge ${pts===3?"pts3b":pts===1?"pts1b":"pts0b"}`}>{pts===3?"🏆 +3 PTS":pts===1?"✅ +1 PT":"❌ 0 PTS"}</span>{pred&&<span style={{fontSize:11,color:"var(--text3)",marginLeft:6}}>{FLAGS[pred.winner]||""} {pred.winner} · {pred.over_under==="over"?"Over 2.5":"Under 2.5"}</span>}</div>}
      {pred&&m.home_score==null&&<div style={{marginBottom:8,fontSize:11,color:"var(--text3)"}}>Tu pick: <strong style={{color:"var(--text2)"}}>{FLAGS[pred.winner]||""} {pred.winner}</strong>{pred.over_under&&<> · <strong style={{color:"var(--blue)"}}>{pred.over_under==="over"?"Over 2.5":"Under 2.5"}</strong></>}</div>}
      {started?(!pred&&<span className="locked-badge">🔒 Cerrado</span>):(
        <>
          <div className="pred-row">
            {[m.home,"Empate",m.away].map(opt=>(
              <button key={opt} className={`pred-btn${pred?.winner===opt?" sel":""}`} onClick={()=>onPredict(m.id,"winner",opt)}>
                <span className="pred-lbl">{opt==="Empate"?"Empate":"Ganador"}</span>
                <span className="pred-val">{FLAGS[opt]||opt}</span>
              </button>
            ))}
          </div>
          <div className="ou-row">
            <button className={`ou-btn${pred?.over_under==="over"?" sel":""}`} onClick={()=>onPredict(m.id,"over_under","over")}>⬆ Over 2.5</button>
            <button className={`ou-btn${pred?.over_under==="under"?" sel":""}`} onClick={()=>onPredict(m.id,"over_under","under")}>⬇ Under 2.5</button>
          </div>
        </>
      )}
    </div>
  );
}

  const [regAvatar,setRegAvatar]=useState("⚽");
  const [editName,setEditName]=useState("");
  const [editAvatar,setEditAvatar]=useState("");
  const [newGName,setNewGName]=useState("");
  const [joinCode,setJoinCode]=useState("");
  const [adminScores,setAdminScores]=useState({});

  const showToast=(msg,type="success")=>setToast({msg,type});
  const token=session?.access_token||SUPA_KEY;
  const isAdmin=profile?.is_admin||session?.user?.email===ADMIN_EMAIL;
  const saveSession=s=>{setSession(s);s?localStorage.setItem("wc_s",JSON.stringify(s)):localStorage.removeItem("wc_s")};

  const loadProfile=useCallback(async(tok,uid)=>{
    const d=await req(`${SUPA_URL}/rest/v1/profiles?id=eq.${uid}&select=*`,tok);
    if(d&&d[0]) setProfile(d[0]);
  },[]);

  const loadGroups=useCallback(async(tok)=>{
    const d=await req(`${SUPA_URL}/rest/v1/groups?select=*`,tok);
    if(Array.isArray(d)) setGroups(d);
  },[]);

  const loadMatches=useCallback(async(tok)=>{
    const d=await req(`${SUPA_URL}/rest/v1/matches?select=*&order=match_date.asc,match_time.asc`,tok);
    if(Array.isArray(d)) setMatches(d);
  },[]);

  const loadGroupData=useCallback(async(tok,gid)=>{
    const ms=await req(`${SUPA_URL}/rest/v1/group_members?group_id=eq.${gid}&select=user_id`,tok);
    if(!Array.isArray(ms)) return;
    const ids=ms.map(m=>m.user_id);
    setMembers(ids);
    if(ids.length===0) return;
    const profs=await req(`${SUPA_URL}/rest/v1/profiles?id=in.(${ids.join(",")})&select=*`,tok);
    if(Array.isArray(profs)){const map={};profs.forEach(p=>map[p.id]=p);setMemberProfiles(map);}
    const filter=ids.map(id=>`user_id=eq.${id}`).join(",");
    const pp=await req(`${SUPA_URL}/rest/v1/predictions?or=(${filter})&select=*`,tok);
    if(Array.isArray(pp)){const map={};pp.forEach(p=>{if(!map[p.user_id])map[p.user_id]={};map[p.user_id][p.match_id]=p});setPreds(map);}
  },[]);

  useEffect(()=>{
    if(!session?.access_token) return;
    setAppLoading(true);
    Promise.all([loadProfile(session.access_token,session.user.id),loadGroups(session.access_token),loadMatches(session.access_token)]).finally(()=>setAppLoading(false));
  },[session]);

  const handleLogin=async()=>{
    setLoading(true);setLoginErr("");
    const d=await fetch(`${SUPA_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY},body:JSON.stringify({email:loginEmail,password:loginPass})}).then(r=>r.json());
    if(!d.access_token){setLoginErr("Email o contraseña incorrectos");}else{saveSession(d);}
    setLoading(false);
  };

  const handleRegister=async()=>{
    if(!regName||!regEmail||!regPass){showToast("Completa todos los campos","error");return;}
    setLoading(true);
    const d=await fetch(`${SUPA_URL}/auth/v1/signup`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY},body:JSON.stringify({email:regEmail,password:regPass,options:{data:{name:regName,avatar:regAvatar}}})}).then(r=>r.json());
    if(d.error){showToast(d.error.message||"Error","error");}else{showToast("¡Cuenta creada! Confirma tu email");setShowReg(false);}
    setLoading(false);
  };

  const handleLogout=()=>{saveSession(null);setProfile(null);setCurrentGroup(null);setPage("groups");};

  const handleSelectGroup=async g=>{
    setCurrentGroup(g);setPage("matches");setLoading(true);
    await loadGroupData(session.access_token,g.id);
    setLoading(false);
  };

  const handleCreateGroup=async()=>{
    if(!newGName.trim()) return;
    setLoading(true);
    const r=await req(`${SUPA_URL}/rest/v1/groups`,session.access_token,{method:"POST",body:JSON.stringify({name:newGName.trim(),admin_id:profile.id})});
    if(Array.isArray(r)&&r[0]){
      await req(`${SUPA_URL}/rest/v1/group_members`,session.access_token,{method:"POST",body:JSON.stringify({group_id:r[0].id,user_id:profile.id})});
      await loadGroups(session.access_token);
      setCurrentGroup(r[0]);setModal(null);setNewGName("");setPage("matches");
      await loadGroupData(session.access_token,r[0].id);
      showToast(`Grupo "${r[0].name}" creado 🎉`);
    }else showToast("Error al crear","error");
    setLoading(false);
  };

  const handleJoin=async()=>{
    if(!joinCode.trim()) return;
    setLoading(true);
    const found=await req(`${SUPA_URL}/rest/v1/groups?invite_code=eq.${joinCode.trim()}&select=*`,session.access_token);
    if(!Array.isArray(found)||!found[0]){showToast("Código inválido","error");setLoading(false);return;}
    const g=found[0];
    await req(`${SUPA_URL}/rest/v1/group_members`,session.access_token,{method:"POST",body:JSON.stringify({group_id:g.id,user_id:profile.id})});
    await loadGroups(session.access_token);
    setCurrentGroup(g);setJoinCode("");setModal(null);setPage("matches");
    await loadGroupData(session.access_token,g.id);
    showToast(`¡Te uniste a ${g.name}!`);
    setLoading(false);
  };

  const handlePredict=async(matchId,field,value)=>{
    const m=matches.find(x=>x.id===matchId);
    if(!m||isStarted(m)) return;
    const existing=preds[profile.id]?.[matchId]||{};
    const np={...existing,user_id:profile.id,match_id:matchId,[field]:value,updated_at:new Date().toISOString()};
    setPreds(prev=>({...prev,[profile.id]:{...(prev[profile.id]||{}),[matchId]:np}}));
    await req(`${SUPA_URL}/rest/v1/predictions?on_conflict=user_id,match_id`,session.access_token,{method:"POST",headers:{"Prefer":"return=representation,resolution=merge-duplicates"},body:JSON.stringify(np)});
    showToast("Guardado ✓");
  };

  const handleSetResult=async mid=>{
    const s=adminScores[mid];
    if(s?.home==null||s?.away==null||s.home===""||s.away==="") return;
    await req(`${SUPA_URL}/rest/v1/matches?id=eq.${mid}`,session.access_token,{method:"PATCH",body:JSON.stringify({home_score:parseInt(s.home),away_score:parseInt(s.away),started:true})});
    await loadMatches(session.access_token);
    showToast("Resultado guardado ✓");
  };

  const handleSaveProfile=async()=>{
    if(!editName.trim()) return;
    await req(`${SUPA_URL}/rest/v1/profiles?id=eq.${profile.id}`,session.access_token,{method:"PATCH",body:JSON.stringify({name:editName,avatar:editAvatar||profile.avatar})});
    setProfile(p=>({...p,name:editName,avatar:editAvatar||p.avatar}));
    setModal(null);showToast("Perfil actualizado ✓");
  };

  const getLeaderboard=()=>members.map(uid=>{
    const up=preds[uid]||{};let pts=0,correct=0,total=0;
    matches.forEach(m=>{if(m.home_score!=null&&up[m.id]){const p=calcPts(up[m.id],m);if(p!=null){pts+=p;total++;if(p>0)correct++;}}});
    return{uid,pts,correct,total,profile:memberProfiles[uid]};
  }).sort((a,b)=>b.pts-a.pts);

  if(appLoading) return <div className="loading"><div className="spin" style={{fontSize:40}}>⚽</div>Cargando...</div>;

  if(!session?.access_token) return(
    <div className="login-page">
      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <div style={{fontSize:52,textAlign:"center",marginBottom:8}}>⚽</div>
      <div className="login-logo">WC Quiniela</div>
      <div className="login-sub">Mundial 2026 · Predicciones</div>
      {!showReg?(
        <div className="login-form">
          <div className="ig"><label className="il">Email</label><input className="inf" type="email" placeholder="tu@email.com" value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()}/></div>
          <div className="ig"><label className="il">Contraseña</label><input className="inf" type="password" placeholder="••••••••" value={loginPass} onChange={e=>setLoginPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()}/></div>
          {loginErr&&<p style={{color:"var(--red)",fontSize:12,textAlign:"center"}}>{loginErr}</p>}
          <button className="btn btn-gold" onClick={handleLogin} disabled={loading}>{loading?"Entrando...":"Entrar"}</button>
          <button className="btn btn-outline" onClick={()=>setShowReg(true)}>Crear cuenta nueva</button>
        </div>
      ):(
        <div className="login-form">
          <div className="ig"><label className="il">Nombre</label><input className="inf" placeholder="Tu nombre o apodo" value={regName} onChange={e=>setRegName(e.target.value)}/></div>
          <div className="ig"><label className="il">Email</label><input className="inf" type="email" placeholder="tu@email.com" value={regEmail} onChange={e=>setRegEmail(e.target.value)}/></div>
          <div className="ig"><label className="il">Contraseña</label><input className="inf" type="password" placeholder="••••••••" value={regPass} onChange={e=>setRegPass(e.target.value)}/></div>
          <div className="ig"><label className="il">Avatar</label><div className="avatar-grid">{AVATARS.map(a=><div key={a} className={`av-opt${regAvatar===a?" sel":""}`} onClick={()=>setRegAvatar(a)}>{a}</div>)}</div></div>
          <button className="btn btn-gold" onClick={handleRegister} disabled={loading}>{loading?"Creando...":"Crear cuenta"}</button>
          <button className="btn btn-outline" onClick={()=>setShowReg(false)}>← Regresar</button>
        </div>
      )}
    </div>
  );

  const lb=getLeaderboard();
  const myRank=lb.findIndex(l=>l.uid===profile?.id);
  const myStats=lb.find(l=>l.uid===profile?.id);
  const filteredMatches=matches.filter(m=>m.phase===phase);

  return(
    <div>
      {toast&&<Toast msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}
      <div className="header">
        <div>
          <div className="logo">WC · Quiniela</div>
          {currentGroup&&<div style={{fontSize:10,color:"var(--text3)",marginTop:-2}}>📌 {currentGroup.name}</div>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {currentGroup&&myRank>=0&&(
            <button onClick={()=>setPage("table")} style={{background:myRank===0?"linear-gradient(135deg,#FFD700,#FFA500)":myRank===1?"linear-gradient(135deg,#C0C0C0,#A0A0A0)":myRank===2?"linear-gradient(135deg,#CD7F32,#A0622A)":"rgba(255,255,255,.08)",border:"none",borderRadius:10,padding:"5px 10px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",lineHeight:1,gap:1}}>
              <span style={{fontFamily:"Bebas Neue,cursive",fontSize:17,letterSpacing:1,color:myRank<3?"#000":"var(--gold)"}}>#{myRank+1}</span>
              <span style={{fontSize:9,fontWeight:700,color:myRank<3?"rgba(0,0,0,.6)":"var(--text3)",textTransform:"uppercase"}}>{myStats?.pts||0} pts</span>
            </button>
          )}
          {isAdmin&&<span className="badge-admin">ADMIN</span>}
          <button onClick={()=>{setEditName(profile?.name||"");setEditAvatar(profile?.avatar||"⚽");setModal("profile");}} style={{width:36,height:36,borderRadius:"50%",background:"linear-gradient(135deg,var(--gold),var(--gold2))",border:"none",cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center"}}>
            {profile?.avatar||"⚽"}
          </button>
        </div>
      </div>

      <div className="main">
        {page==="groups"&&(
          <div>
            <div className="section-title">Mis Grupos</div>
            <div className="section-sub">Entra a un grupo para predecir</div>
            {groups.map(g=>(
              <div key={g.id} className={`group-card${currentGroup?.id===g.id?" active":""}`} onClick={()=>handleSelectGroup(g)}>
                <div style={{fontFamily:"Bebas Neue,cursive",fontSize:24,color:"var(--gold)",letterSpacing:2}}>🏆 {g.name}</div>
                <div style={{fontSize:12,color:"var(--text3)",marginTop:4}}>Toca para entrar</div>
                {g.admin_id===profile?.id&&(
                  <div className="invite-box" onClick={e=>e.stopPropagation()}>
                    <div style={{fontSize:10,color:"var(--text3)",letterSpacing:1,textTransform:"uppercase",marginBottom:4}}>🔗 Código de invitación</div>
                    <div className="invite-code">{g.invite_code}</div>
                    <div style={{fontSize:11,color:"var(--text3)",marginTop:4}}>Comparte este código con tus amigos</div>
                    <button className="btn btn-sm btn-outline" style={{marginTop:8}} onClick={()=>{navigator.clipboard?.writeText(g.invite_code);showToast("Código copiado 📋");}}>Copiar código</button>
                  </div>
                )}
              </div>
            ))}
            {groups.length===0&&<div className="empty"><div style={{fontSize:44,marginBottom:10}}>👥</div><div style={{fontSize:14}}>Crea o únete a un grupo</div></div>}
            <div style={{display:"flex",gap:8,marginTop:8}}>
              <button className="btn btn-gold" style={{flex:1}} onClick={()=>setModal("newGroup")}>+ Crear grupo</button>
              <button className="btn btn-outline" style={{flex:1}} onClick={()=>setModal("joinGroup")}>🔗 Unirme</button>
            </div>
          </div>
        )}

        {page==="matches"&&(
          <div>
            <div className="section-title">Partidos</div>
            <div className="section-sub">{filteredMatches.filter(m=>preds[profile?.id]?.[m.id]).length} predicciones en esta fase</div>
            <div className="tabs">{PHASES.map(ph=><button key={ph} className={`tab-btn${phase===ph?" active":""}`} onClick={()=>setPhase(ph)}>{ph==="Fase de Grupos"?"Grupos":ph}</button>)}</div>
            {filteredMatches.map(m=><MatchCard key={m.id} match={m} userPred={preds[profile?.id]?.[m.id]} onPredict={handlePredict}/>)}
          </div>
        )}

        {page==="table"&&(
          <div>
            <div className="section-title">Tabla General</div>
            <div className="section-sub">{currentGroup?.name} · {lb.length} jugadores</div>
            {currentGroup?(
              <>
                {myStats&&(
                  <div style={{background:"linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,165,0,.06))",border:"2px solid rgba(255,215,0,.4)",borderRadius:20,padding:"18px 16px",marginBottom:18}}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <div style={{background:myRank===0?"linear-gradient(135deg,#FFD700,#FFA500)":myRank===1?"linear-gradient(135deg,#C0C0C0,#A8A8A8)":myRank===2?"linear-gradient(135deg,#CD7F32,#A0622A)":"rgba(255,255,255,.1)",borderRadius:12,padding:"6px 14px",fontFamily:"Bebas Neue,cursive",fontSize:28,letterSpacing:2,color:myRank<3?"#000":"var(--gold)",lineHeight:1}}>
                          #{myRank+1}
                        </div>
                        <div>
                          <div style={{fontFamily:"Barlow Condensed,sans-serif",fontWeight:700,fontSize:10,letterSpacing:2,color:"var(--text3)",textTransform:"uppercase"}}>TU POSICIÓN</div>
                          <div style={{fontWeight:700,fontSize:14}}>{myRank===0?"🥇 Líder del grupo":myRank===1?"🥈 Segundo lugar":myRank===2?"🥉 Tercer lugar":`${lb.length-myRank-1} personas detrás`}</div>
                        </div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontFamily:"Bebas Neue,cursive",fontSize:42,color:"var(--gold)",lineHeight:1}}>{myStats.pts}</div>
                        <div style={{fontSize:9,color:"var(--text3)",fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>puntos</div>
                      </div>
                    </div>
                    {lb.length>1&&(
                      <div style={{display:"flex",gap:8,marginBottom:12}}>
                        {myRank>0&&<div style={{flex:1,background:"rgba(230,57,70,.1)",border:"1px solid rgba(230,57,70,.2)",borderRadius:10,padding:"7px 10px",textAlign:"center"}}><div style={{fontSize:9,color:"var(--text3)",fontWeight:700,textTransform:"uppercase"}}>⬆ Al #{myRank}</div><div style={{fontFamily:"Bebas Neue,cursive",fontSize:18,color:"var(--red)"}}>-{lb[myRank-1].pts-myStats.pts} pts</div></div>}
                        {myRank<lb.length-1&&<div style={{flex:1,background:"rgba(16,185,129,.1)",border:"1px solid rgba(16,185,129,.2)",borderRadius:10,padding:"7px 10px",textAlign:"center"}}><div style={{fontSize:9,color:"var(--text3)",fontWeight:700,textTransform:"uppercase"}}>⬇ Al #{myRank+2}</div><div style={{fontFamily:"Bebas Neue,cursive",fontSize:18,color:"var(--green)"}}>+{myStats.pts-lb[myRank+1].pts} pts</div></div>}
                      </div>
                    )}
                    <div style={{display:"flex",gap:8}}>
                      <div className="stat-chip"><div className="stat-chip-val">{myStats.correct}</div><div className="stat-chip-lbl">Aciertos</div></div>
                      <div className="stat-chip"><div className="stat-chip-val">{myStats.total}</div><div className="stat-chip-lbl">Jugados</div></div>
                      <div className="stat-chip"><div className="stat-chip-val">{myStats.total>0?Math.round(myStats.correct/myStats.total*100):0}%</div><div className="stat-chip-lbl">Efecto.</div></div>
                    </div>
                  </div>
                )}
                <div style={{display:"flex",gap:8,marginBottom:18}}>
                  {[{r:0,icon:"🥇",color:"#FFD700"},{r:1,icon:"🥈",color:"#C0C0C0"},{r:2,icon:"🥉",color:"#CD7F32"}].map(({r,icon,color})=>{
                    const item=lb[r];
                    return(<div key={r} style={{flex:1,background:"rgba(255,255,255,.03)",border:`1px solid ${color}40`,borderRadius:12,padding:"10px 6px",textAlign:"center"}}>
                      <div style={{fontSize:20}}>{icon}</div>
                      {item?(<><div style={{fontSize:22,marginTop:2}}>{item.profile?.avatar||"⚽"}</div><div style={{fontSize:12,fontWeight:700,marginTop:2,color:"var(--text2)"}}>{item.profile?.name||"..."}</div><div style={{fontFamily:"Bebas Neue,cursive",fontSize:18,color}}>{item.pts} pts</div></>):<div style={{fontSize:12,color:"var(--text3)",marginTop:6}}>—</div>}
                    </div>);
                  })}
                </div>
                <div style={{fontFamily:"Barlow Condensed,sans-serif",fontWeight:700,fontSize:10,letterSpacing:2,color:"var(--text3)",textTransform:"uppercase",marginBottom:10}}>Clasificación completa</div>
                {lb.map((item,i)=>{
                  const isMe=item.uid===profile?.id;
                  return(
                    <div key={item.uid} className={`lb-item${i===0?" r1":i===1?" r2":i===2?" r3":""}`} style={isMe?{outline:"2px solid rgba(255,215,0,.6)",outlineOffset:2}:{}}>
                      <div style={{fontFamily:"Bebas Neue,cursive",fontSize:22,minWidth:32,textAlign:"center",color:isMe?"var(--gold)":"var(--text3)"}}>
                        {i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}
                      </div>
                      <div style={{fontSize:22}}>{item.profile?.avatar||"⚽"}</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:700,fontSize:14}}>{item.profile?.name||"Jugador"}{isMe&&<span style={{fontSize:10,fontWeight:700,color:"var(--gold)",marginLeft:6}}>← TÚ</span>}</div>
                        <div style={{fontSize:11,color:"var(--text3)"}}>{item.correct} aciertos · {item.total} jugados</div>
                      </div>
                      <div className="lb-pts">{item.pts}<span> pts</span></div>
                    </div>
                  );
                })}
                {lb.length===0&&<div className="empty"><div style={{fontSize:44,marginBottom:10}}>🏆</div><div style={{fontSize:14}}>Aún sin predicciones</div></div>}
              </>
            ):<div className="empty"><div style={{fontSize:44,marginBottom:10}}>👥</div><div style={{fontSize:14}}>Selecciona un grupo primero</div></div>}
          </div>
        )}

        {page==="admin"&&isAdmin&&(
          <div>
            <div className="section-title">Panel Admin</div>
            <div className="section-sub">Ingresa resultados</div>
            <div className="tabs">{PHASES.map(ph=><button key={ph} className={`tab-btn${phase===ph?" active":""}`} onClick={()=>setPhase(ph)}>{ph==="Fase de Grupos"?"Grupos":ph}</button>)}</div>
            {matches.filter(m=>m.phase===phase).map(m=>(
              <div key={m.id} style={{background:"var(--card)",border:"1px solid var(--border)",borderRadius:14,padding:14,marginBottom:10}}>
                <div style={{fontFamily:"Barlow Condensed,sans-serif",fontWeight:700,fontSize:11,letterSpacing:1,color:"var(--text3)",marginBottom:6}}>{m.match_group?`Grupo ${m.match_group}`:m.phase} · {fmtDate(m.match_date)}</div>
                <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>{FLAGS[m.home]||""} {m.home} vs {FLAGS[m.away]||""} {m.away}</div>
                {!m.match_group&&(
                  <div style={{display:"flex",gap:6,marginBottom:10}}>
                    <input style={{flex:1,background:"rgba(255,255,255,.06)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 10px",color:"var(--text)",fontSize:13,outline:"none"}} placeholder="Local" defaultValue={m.home} onBlur={async e=>{if(e.target.value!==m.home){await req(`${SUPA_URL}/rest/v1/matches?id=eq.${m.id}`,session.access_token,{method:"PATCH",body:JSON.stringify({home:e.target.value})});await loadMatches(session.access_token);}}}/>
                    <input style={{flex:1,background:"rgba(255,255,255,.06)",border:"1px solid var(--border)",borderRadius:8,padding:"7px 10px",color:"var(--text)",fontSize:13,outline:"none"}} placeholder="Visitante" defaultValue={m.away} onBlur={async e=>{if(e.target.value!==m.away){await req(`${SUPA_URL}/rest/v1/matches?id=eq.${m.id}`,session.access_token,{method:"PATCH",body:JSON.stringify({away:e.target.value})});await loadMatches(session.access_token);}}}/>
                  </div>
                )}
                {m.home_score!=null?(
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span className="pts-badge pts3b">✓ {m.home_score} – {m.away_score}</span>
                    <button className="btn btn-xs btn-outline" onClick={async()=>{await req(`${SUPA_URL}/rest/v1/matches?id=eq.${m.id}`,session.access_token,{method:"PATCH",body:JSON.stringify({home_score:null,away_score:null})});await loadMatches(session.access_token);}}>Editar</button>
                  </div>
                ):(
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <input style={{width:50,padding:"8px 6px",textAlign:"center",background:"rgba(255,255,255,.08)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text)",fontSize:20,fontWeight:700,outline:"none"}} type="number" min="0" max="20" placeholder="0" value={adminScores[m.id]?.home??""} onChange={e=>setAdminScores(p=>({...p,[m.id]:{...(p[m.id]||{}),home:e.target.value}}))}/>
                    <span style={{fontSize:18,color:"var(--text3)",fontWeight:700}}>–</span>
                    <input style={{width:50,padding:"8px 6px",textAlign:"center",background:"rgba(255,255,255,.08)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text)",fontSize:20,fontWeight:700,outline:"none"}} type="number" min="0" max="20" placeholder="0" value={adminScores[m.id]?.away??""} onChange={e=>setAdminScores(p=>({...p,[m.id]:{...(p[m.id]||{}),away:e.target.value}}))}/>
                    <button className="btn btn-gold btn-xs" onClick={()=>handleSetResult(m.id)}>Guardar</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="nav">
        <button className={`nav-btn${page==="groups"?" active":""}`} onClick={()=>setPage("groups")}><span className="nav-icon">👥</span>Grupos</button>
        <button className={`nav-btn${page==="matches"?" active":""}`} onClick={()=>{if(!currentGroup){showToast("Selecciona un grupo","error");return;}setPage("matches");}}><span className="nav-icon">⚽</span>Partidos</button>
        <button className={`nav-btn${page==="table"?" active":""}`} onClick={()=>setPage("table")}><span className="nav-icon">🏆</span>Tabla</button>
        {isAdmin&&<button className={`nav-btn${page==="admin"?" active":""}`} onClick={()=>setPage("admin")}><span className="nav-icon">⚙️</span>Admin</button>}
        <button className="nav-btn" onClick={handleLogout}><span className="nav-icon">🚪</span>Salir</button>
      </div>

      {modal==="profile"&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-title">Mi Perfil</div>
            <div style={{fontSize:52,textAlign:"center",marginBottom:8}}>{editAvatar||profile?.avatar}</div>
            <div className="ig" style={{marginBottom:14}}><label className="il">Avatar</label><div className="avatar-grid">{AVATARS.map(a=><div key={a} className={`av-opt${(editAvatar||profile?.avatar)===a?" sel":""}`} onClick={()=>setEditAvatar(a)}>{a}</div>)}</div></div>
            <div className="ig" style={{marginBottom:14}}><label className="il">Nombre visible</label><input className="inf" value={editName} onChange={e=>setEditName(e.target.value)}/></div>
            <p style={{fontSize:11,color:"var(--text3)",marginBottom:14}}>📧 {session?.user?.email}</p>
            <div style={{display:"flex",gap:8}}><button className="btn btn-gold" style={{flex:1}} onClick={handleSaveProfile}>Guardar</button><button className="btn btn-outline" onClick={()=>setModal(null)}>Cancelar</button></div>
          </div>
        </div>
      )}
      {modal==="newGroup"&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-title">Crear Grupo</div>
            <div className="ig" style={{marginBottom:14}}><label className="il">Nombre del grupo</label><input className="inf" placeholder="Ej: Familia, Trabajo, Amigos..." value={newGName} onChange={e=>setNewGName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleCreateGroup()}/></div>
            <p style={{fontSize:12,color:"var(--text3)",marginBottom:14}}>Se genera un código automático para invitar amigos.</p>
            <div style={{display:"flex",gap:8}}><button className="btn btn-gold" style={{flex:1}} onClick={handleCreateGroup} disabled={loading||!newGName.trim()}>{loading?"Creando...":"Crear"}</button><button className="btn btn-outline" onClick={()=>setModal(null)}>Cancelar</button></div>
          </div>
        </div>
      )}
      {modal==="joinGroup"&&(
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-title">Unirme a Grupo</div>
            <div className="ig" style={{marginBottom:14}}><label className="il">Código de invitación</label><input className="inf" placeholder="Ej: a1b2c3d4" value={joinCode} onChange={e=>setJoinCode(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleJoin()} style={{letterSpacing:3,textTransform:"uppercase",fontFamily:"Bebas Neue,cursive",fontSize:22}}/></div>
            <p style={{fontSize:12,color:"var(--text3)",marginBottom:14}}>Pídele el código al admin del grupo.</p>
            <div style={{display:"flex",gap:8}}><button className="btn btn-gold" style={{flex:1}} onClick={handleJoin} disabled={loading||!joinCode.trim()}>{loading?"Buscando...":"Unirme"}</button><button className="btn btn-outline" onClick={()=>setModal(null)}>Cancelar</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
