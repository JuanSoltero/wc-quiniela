
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WC Quiniela 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#FFD700;--gold2:#FFA500;--red:#E63946;--dark:#0A0E1A;--dark2:#111827;--dark3:#1F2937;--text:#F9FAFB;--text2:#D1D5DB;--text3:#9CA3AF;--green:#10B981;--blue:#3B82F6;--card:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08)}
body{background:var(--dark);color:var(--text);font-family:'Barlow',sans-serif;min-height:100vh}
.app{min-height:100vh;background:var(--dark)}
.header{position:sticky;top:0;z-index:100;background:rgba(10,14,26,.97);border-bottom:1px solid rgba(255,215,0,.15);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:'Bebas Neue',cursive;font-size:26px;letter-spacing:2px;background:linear-gradient(135deg,var(--gold),var(--gold2),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(10,14,26,.97);border-top:1px solid rgba(255,215,0,.15);display:flex;justify-content:space-around;padding:8px 0 16px}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:10px;font-weight:700;padding:6px 12px;min-width:56px;font-family:'Barlow',sans-serif}
.nb.on{color:var(--gold)}
.ni{font-size:20px}
.main{padding:20px 16px 96px;max-width:480px;margin:0 auto}
.lp{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--dark)}
.ll{font-family:'Bebas Neue',cursive;font-size:52px;letter-spacing:4px;text-align:center;background:linear-gradient(135deg,var(--gold),var(--gold2),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.ls{font-family:'Barlow Condensed',sans-serif;color:var(--text3);font-size:13px;letter-spacing:3px;text-align:center;text-transform:uppercase;margin-bottom:36px}
.lf{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.ig{display:flex;flex-direction:column;gap:5px}
.il{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
input.inf{background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text);font-family:'Barlow',sans-serif;font-size:16px;outline:none;width:100%}
input.inf:focus{border-color:rgba(255,215,0,.5)}
.btn{padding:13px 20px;border-radius:12px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;width:100%}
.bg{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000}
.bo{background:transparent;color:var(--text2);border:1px solid var(--border)}
.bxs{padding:6px 12px;font-size:12px;border-radius:8px;width:auto}
.bsm{padding:9px 16px;font-size:13px;width:auto}
.btn:disabled{opacity:.4;cursor:not-allowed}
.st{font-family:'Bebas Neue',cursive;font-size:28px;letter-spacing:2px;color:var(--gold);margin-bottom:4px}
.ss{font-size:13px;color:var(--text3);margin-bottom:18px}
.tabs{display:flex;gap:4px;margin-bottom:18px;overflow-x:auto;padding-bottom:4px}
.tb{padding:7px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;cursor:pointer;white-space:nowrap}
.tb.on{background:var(--gold);color:#000;border-color:var(--gold)}
.mc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px}
.mc.pred{border-color:rgba(16,185,129,.3);background:rgba(16,185,129,.04)}
.mc.lock{border-color:rgba(230,57,70,.2)}
.mc.p3{border-color:rgba(255,215,0,.5);background:rgba(255,215,0,.05)}
.mc.p1{border-color:rgba(59,130,246,.4);background:rgba(59,130,246,.05)}
.mph{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between}
.mtt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin-bottom:12px}
.ts{display:flex;flex-direction:column;align-items:center;gap:3px}
.tf{font-size:26px}
.tn{font-size:10px;font-weight:700;text-align:center;color:var(--text2)}
.mvs{font-family:'Bebas Neue',cursive;font-size:18px;color:var(--text3);letter-spacing:2px}
.mr{background:rgba(255,255,255,.1);border-radius:8px;padding:4px 10px;font-size:17px;font-weight:700;font-family:'Barlow Condensed',sans-serif;color:var(--gold)}
.pr{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pb{flex:1;min-width:0;padding:9px 6px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:'Barlow',sans-serif}
.pb:disabled{cursor:not-allowed;opacity:.5}
.pb.on{border-color:var(--gold);background:rgba(255,215,0,.15)}
.pl{font-size:9px;color:var(--text3);font-weight:700}
.pv{font-size:12px;color:var(--text);font-weight:700}
.pb.on .pv{color:var(--gold)}
.our{display:flex;gap:6px;margin-top:6px}
.ob{flex:1;padding:8px;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--text2)}
.ob:disabled{cursor:not-allowed;opacity:.5}
.ob.on{border-color:var(--blue);background:rgba(59,130,246,.15);color:var(--blue)}
.lkb{display:inline-flex;align-items:center;gap:4px;background:rgba(230,57,70,.15);border:1px solid rgba(230,57,70,.3);border-radius:6px;padding:3px 8px;font-size:10px;font-weight:700;color:var(--red)}
.ptb{display:inline-flex;align-items:center;gap:3px;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:700}
.pt3{background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);color:var(--gold)}
.pt1{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.4);color:var(--blue)}
.pt0{background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.2);color:var(--red)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);margin-bottom:8px}
.li.r1{border-color:rgba(255,215,0,.5);background:rgba(255,215,0,.06)}
.li.r2{border-color:rgba(192,192,192,.4)}
.li.r3{border-color:rgba(205,127,50,.4)}
.lpts{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--gold)}
.lpts span{font-size:12px;color:var(--text3);font-family:'Barlow',sans-serif}
.gc{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:14px;cursor:pointer}
.gc.on{border-color:var(--gold);background:rgba(255,215,0,.06)}
.sc{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:8px 12px;text-align:center;flex:1}
.sv{font-family:'Bebas Neue',cursive;font-size:24px;color:var(--gold)}
.sl{font-size:9px;color:var(--text3);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.mo{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px}
.md{background:var(--dark2);border:1px solid var(--border);border-radius:22px;padding:24px;width:100%;max-width:400px;max-height:82vh;overflow-y:auto}
.mt{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--gold);letter-spacing:2px;margin-bottom:18px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:300;background:var(--dark3);border:1px solid var(--border);border-radius:12px;padding:11px 18px;font-size:13px;font-weight:600;white-space:nowrap}
.tok{border-color:rgba(16,185,129,.5);color:var(--green)}
.ter{border-color:rgba(230,57,70,.5);color:var(--red)}
.ag{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.ao{font-size:26px;text-align:center;padding:7px;border-radius:9px;cursor:pointer;border:2px solid transparent}
.ao.on{border-color:var(--gold);background:rgba(255,215,0,.1)}
.empty{text-align:center;padding:44px 24px;color:var(--text3)}
.ib{background:rgba(255,215,0,.08);border:1px dashed rgba(255,215,0,.4);border-radius:12px;padding:14px;text-align:center;margin:12px 0}
.ic{font-family:'Bebas Neue',cursive;font-size:32px;letter-spacing:6px;color:var(--gold)}
.load{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text3);font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite;display:inline-block;font-size:40px}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(255,215,0,.3);border-radius:2px}
</style>
</head>
<body>
<div id="app"><div class="load"><div class="spin">⚽</div>CARGANDO...<div id="slow" style="display:none;margin-top:20px"><button onclick="localStorage.clear();location.reload()" style="background:rgba(255,215,0,.2);border:1px solid rgba(255,215,0,.4);color:#FFD700;padding:10px 20px;border-radius:10px;cursor:pointer;font-family:Barlow Condensed,sans-serif;font-size:14px;font-weight:700;letter-spacing:1px">¿Tarda mucho? Toca aquí</button></div></div></div>
<script>
const S="https://drzdkghucqgjedfsblbt.supabase.co";
const K="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyemRrZ2h1Y3FnamVkZnNibGJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1Mjg0MTQsImV4cCI6MjA5NjEwNDQxNH0.pmiVKy4byc7FutacGwMSjMLzMk-rVB0mcaMGAoHoG_c";
const ADMIN="juanalvarosoltero@gmail.com";
const PHASES=["Fase de Grupos","Dieciseisavos de Final","Octavos de Final","Cuartos de Final","Semifinal","Tercer Lugar","Final"];
const AVS=["⚽","🏆","🌟","🔥","💪","🦁","🐯","🦊","🦅","🎯","🚀","⚡","💎","👑","🌙","☀️","🎪","🐉","🏅","🎖️"];
const FL={"México":"🇲🇽","Canadá":"🇨🇦","Uruguay":"🇺🇾","Senegal":"🇸🇳","España":"🇪🇸","Marruecos":"🇲🇦","Croacia":"🇭🇷","Bélgica":"🇧🇪","Brasil":"🇧🇷","Japón":"🇯🇵","Suiza":"🇨🇭","Argentina":"🇦🇷","Polonia":"🇵🇱","Arabia Saudita":"🇸🇦","Australia":"🇦🇺","Francia":"🇫🇷","Países Bajos":"🇳🇱","Ecuador":"🇪🇨","Qatar":"🇶🇦","Inglaterra":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Irán":"🇮🇷","Estados Unidos":"🇺🇸","Portugal":"🇵🇹","Ghana":"🇬🇭","Corea del Sur":"🇰🇷","Alemania":"🇩🇪","Costa Rica":"🇨🇷","Empate":"🤝","Sudáfrica":"🇿🇦","República Checa":"🇨🇿","Bosnia y Herzegovina":"🇧🇦","Escocia":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Haití":"🇭🇹","Paraguay":"🇵🇾","Turquía":"🇹🇷","Costa de Marfil":"🇨🇮","Curazao":"🇨🇼","Túnez":"🇹🇳","Suecia":"🇸🇪","Egipto":"🇪🇬","Nueva Zelanda":"🇳🇿","Cabo Verde":"🇨🇻","Noruega":"🇳🇴","Irak":"🇮🇶","Argelia":"🇩🇿","Austria":"🇦🇹","Jordania":"🇯🇴","Colombia":"🇨🇴","Uzbekistán":"🇺🇿","R.D. Congo":"🇨🇩","Panamá":"🇵🇦","Por definir":"🏳️"};

// State
let session=null,profile=null,groups=[],curGroup=null,members=[],mProfs={},matches=[],preds={},page="groups",phase="Fase de Grupos",modal=null,adminScores={},toastT=null;

// Helpers
const $=id=>document.getElementById(id);
const h=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const api=async(url,tok,opts={})=>{
  try{
    const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json","apikey":K,"Authorization":"Bearer "+(tok||K),"Prefer":"return=representation",...(opts.headers||{})}});
    if(r.status===204)return[];
    const j=await r.json();
    return j;
  }catch(e){console.error(e);return null;}
};
const saveS=s=>{session=s;s?localStorage.setItem("wc_s",JSON.stringify(s)):localStorage.removeItem("wc_s");};
const loadS=()=>{try{return JSON.parse(localStorage.getItem("wc_s")||"null");}catch{return null;}};
const tok=()=>session&&session.access_token?session.access_token:K;
const isAdmin=()=>profile&&(profile.is_admin||(session&&session.user&&session.user.email===ADMIN));

const fmtDate=d=>{if(!d)return"";try{return new Date(d+"T12:00:00").toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"});}catch{return d;}};
const fmtTime=(d,t)=>{if(!d||!t)return t||"";try{const dt=new Date(d+"T"+(t||"12:00").substring(0,5)+":00-06:00");return dt.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}catch{return t||"";}};
const isStarted=m=>{if(m.started)return true;try{return new Date()>=new Date(m.match_date+"T"+(m.match_time||"12:00").substring(0,5)+":00-06:00");}catch{return false;}};
const winner=(h,a,hs,as)=>hs>as?h:as>hs?a:"Empate";
const ou=(hs,as,line)=>(hs+as)>(line||2.5)?"over":"under";
const pts=(pred,m)=>{if(m.home_score==null||!pred||!pred.winner)return null;const hw=pred.winner===winner(m.home,m.away,m.home_score,m.away_score),ho=pred.over_under===ou(m.home_score,m.away_score,m.ou_line);return hw&&ho?(m.phase==="Fase de Grupos"?3:4):hw||ho?1:0;};

const showToast=(msg,type)=>{
  if(toastT)clearTimeout(toastT);
  const el=document.createElement("div");
  el.className="toast "+(type==="error"?"ter":"tok");
  el.textContent=msg;
  document.body.appendChild(el);
  toastT=setTimeout(()=>el.remove(),2500);
};

// RENDER
const render=()=>{
  if(!session||!session.access_token){renderLogin();return;}
  renderApp();
};

const renderLogin=()=>{
  $("app").innerHTML=`
  <div class="lp">
    <div style="font-size:52px;text-align:center;margin-bottom:8px">⚽</div>
    <div class="ll">WC Quiniela</div>
    <div class="ls">Mundial 2026 · Predicciones</div>
    <div class="lf" id="lf"></div>
  </div>`;
  renderLoginForm();
};

let showReg=false,regAvatar="⚽";
const renderLoginForm=()=>{
  const f=$("lf");
  if(!showReg){
    f.innerHTML=`
    <div class="ig"><label class="il">Email</label><input class="inf" id="le" type="email" placeholder="tu@email.com"/></div>
    <div class="ig"><label class="il">Contraseña</label><input class="inf" id="lp" type="password" placeholder="••••••••"/></div>
    <div id="lerr" style="color:var(--red);font-size:12px;text-align:center;display:none"></div>
    <button class="btn bg" id="lbtn">Entrar</button>
    <button class="btn bo" id="rbtn">Crear cuenta nueva</button>`;
    $("lbtn").onclick=doLogin;
    $("le").onkeydown=$("lp").onkeydown=e=>{if(e.key==="Enter")doLogin();};
    $("rbtn").onclick=()=>{showReg=true;renderLoginForm();};
  } else {
    f.innerHTML=`
    <div class="ig"><label class="il">Nombre</label><input class="inf" id="rn" placeholder="Tu nombre o apodo"/></div>
    <div class="ig"><label class="il">Email</label><input class="inf" id="re" type="email" placeholder="tu@email.com"/></div>
    <div class="ig"><label class="il">Contraseña</label><input class="inf" id="rp" type="password" placeholder="••••••••"/></div>
    <div class="ig"><label class="il">Avatar</label><div class="ag" id="ag">${AVS.map(a=>`<div class="ao${a===regAvatar?" on":""}" onclick="regAvatar='${a}';renderLoginForm()">${a}</div>`).join("")}</div></div>
    <button class="btn bg" id="crbtn">Crear cuenta</button>
    <button class="btn bo" onclick="showReg=false;renderLoginForm()">← Regresar</button>`;
    $("crbtn").onclick=doRegister;
  }
};

const doLogin=async()=>{
  const e=$("le").value,p=$("lp").value;
  if(!e||!p)return;
  $("lbtn").textContent="Entrando...";$("lbtn").disabled=true;
  const d=await fetch(S+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":K},body:JSON.stringify({email:e,password:p})}).then(r=>r.json());
  if(!d.access_token){
    $("lerr").textContent="Email o contraseña incorrectos";$("lerr").style.display="block";
    $("lbtn").textContent="Entrar";$("lbtn").disabled=false;
  } else {
   saveS(d);try{const to=new Promise((_,r)=>setTimeout(()=>r("t"),6000));await Promise.race([initApp(),to]);}catch(e){saveS(null);session=null;}render();
  }
};

const doRegister=async()=>{
  const n=$("rn").value,e=$("re").value,p=$("rp").value;
  if(!n||!e||!p){showToast("Completa todos los campos","error");return;}
  $("crbtn").textContent="Creando...";$("crbtn").disabled=true;
  const d=await fetch(S+"/auth/v1/signup",{method:"POST",headers:{"Content-Type":"application/json","apikey":K},body:JSON.stringify({email:e,password:p,options:{data:{name:n,avatar:regAvatar}}})}).then(r=>r.json());
  if(d.error){showToast(d.error.message||"Error","error");$("crbtn").textContent="Crear cuenta";$("crbtn").disabled=false;}
  else{showToast("¡Cuenta creada! Ya puedes entrar");showReg=false;renderLoginForm();}
};

setTimeout(()=>{const s=document.getElementById("slow");if(s)s.style.display="block";},4000);const initApp=async()=>{try{
  if(!session||!session.access_token)return;
  const t=tok(),uid=session.user.id;
  const [pr,gr,mt]=await Promise.all([
    api(S+"/rest/v1/profiles?id=eq."+uid+"&select=*",t),
  api(S+"/rest/v1/groups?select=*",t),
    api(S+"/rest/v1/matches?select=*&order=match_date.asc,match_time.asc",t)
  ]);
  if(pr&&pr[0])profile=pr[0];
  if(Array.isArray(gr))groups=gr;   const savedGroup=localStorage.getItem('wc_group');   if(savedGroup&&groups.find(g=>g.id===savedGroup)){curGroup=groups.find(g=>g.id===savedGroup);await loadGroupData(savedGroup);}
  if(Array.isArray(mt))matches=mt;
}catch(e){saveS(null);session=null;render();}
};

const loadGroupData=async(gid)=>{
  const t=tok();
  const ms=await api(S+"/rest/v1/group_members?group_id=eq."+gid+"&select=user_id",t);
  if(!Array.isArray(ms))return;
  members=ms.map(m=>m.user_id);
  if(members.length===0){mProfs={};preds={};return;}
  const [pr,pp]=await Promise.all([
    api(S+"/rest/v1/profiles?id=in.("+members.join(",")+")"+"&select=*",t),
    api(S+"/rest/v1/predictions?user_id=in.("+members.join(",")+")"+"&select=*&limit=5000",t)
  ]);
  if(Array.isArray(pr)){mProfs={};pr.forEach(p=>{mProfs[p.id]=p;});}
  if(Array.isArray(pp)){preds={};pp.forEach(p=>{if(!preds[p.user_id])preds[p.user_id]={};preds[p.user_id][p.match_id]=p;});}
};

const renderApp=()=>{
  const lb=getLeaderboard();
  const myR=lb.findIndex(l=>l.uid===profile.id);
  const myS=lb[myR];
  $("app").innerHTML=`
  <div class="app">
    <div class="header">
      <div>
        <div class="logo">WC · Quiniela</div>
        ${curGroup?`<div style="font-size:10px;color:var(--text3);margin-top:-2px">📌 ${h(curGroup.name)}</div>`:""}
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        ${curGroup&&myR>=0?`<button onclick="page='table';renderApp()" style="background:${myR===0?"linear-gradient(135deg,#FFD700,#FFA500)":myR===1?"linear-gradient(135deg,#C0C0C0,#A0A0A0)":myR===2?"linear-gradient(135deg,#CD7F32,#A0622A)":"rgba(255,255,255,.08)"};border:none;border-radius:10px;padding:5px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1;gap:1px"><span style="font-family:'Bebas Neue',cursive;font-size:17px;color:${myR<3?"#000":"var(--gold)"}">#${myR+1}</span><span style="font-size:9px;font-weight:700;color:${myR<3?"rgba(0,0,0,.6)":"var(--text3)"};text-transform:uppercase">${myS?myS.pts:0} pts</span></button>`:""}

const matchCard=(m,pred)=>{
  const started=isStarted(m);
  const p=pred&&m.home_score!=null?pts(pred,m):null;
  const cls="mc"+(pred?" pred":"")+(started&&m.home_score==null?" lock":"")+(p===3?" p3":p===1?" p1":"");
  return`<div class="${cls}">
    <div class="mph">
      <span>${m.match_group?"Grupo "+m.match_group:m.phase}</span>
      <span style="font-size:10px;color:var(--text3)">${fmtDate(m.match_date)} ${fmtTime(m.match_date,m.match_time)}</span>
    </div>
    <div class="mtt">
      <div class="ts"><span class="tf">${FL[m.home]||"🏳️"}</span><span class="tn">${h(m.home)}</span></div>
      ${m.home_score!=null?`<div class="mr">${m.home_score} – ${m.away_score}</div>`:`<span class="mvs">VS</span>`}
      <div class="ts"><span class="tf">${FL[m.away]||"🏳️"}</span><span class="tn">${h(m.away)}</span></div>
    </div>
    ${p!=null?`<div style="margin-bottom:8px"><span class="ptb ${p>=3?"pt3":p===1?"pt1":"pt0"}">${p>=3?"🏆 +"+p+" PTS":p===1?"✅ +1 PT":"❌ 0 PTS"}</span>${pred?`<span style="font-size:11px;color:var(--text3);margin-left:6px">${FL[pred.winner]||""} ${h(pred.winner)} · ${pred.over_under==="over"?`Over ${m.ou_line||2.5}`:`Under ${m.ou_line||2.5}`}</span>`:""}
    </div>`:""}
    ${pred&&m.home_score==null?`<div style="margin-bottom:8px;font-size:11px;color:var(--text3)">Tu pick: <strong style="color:var(--text2)">${FL[pred.winner]||""} ${h(pred.winner)}</strong>${pred.over_under?` · <strong style="color:var(--blue)">${pred.over_under==="over"?`Over ${m.ou_line||2.5}`:`Under ${m.ou_line||2.5}`}</strong>`:""}</div>`:""}
    ${started?(!pred&&!m.home_score?`<span class="lkb">🔒 Cerrado</span>`:"")+(()=>{const mp=members.map(uid=>(preds[uid]||{})[m.id]).filter(x=>x&&x.winner);if(mp.length===0)return"";const tot=mp.length;const wc={};mp.forEach(p=>{wc[p.winner]=(wc[p.winner]||0)+1;});const ov=mp.filter(p=>p.over_under==="over").length;const un=mp.filter(p=>p.over_under==="under").length;return`<div style="margin-top:8px;padding:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;font-size:11px"><div style="font-weight:700;color:var(--gold);margin-bottom:6px;letter-spacing:1px">📊 VOTOS (${tot})</div>${Object.keys(wc).map(w=>`<div style="display:flex;justify-content:space-between;margin-bottom:3px"><span>${FL[w]||""} ${h(w)}</span><span style="color:var(--gold);font-weight:700">${Math.round(wc[w]/tot*100)}%</span></div>`).join("")}<div style="border-top:1px solid var(--border);margin:6px 0;padding-top:6px;display:flex;justify-content:space-between"><span>⬆ Over</span><span style="color:var(--blue);font-weight:700">${Math.round(ov/tot*100)}%</span></div><div style="display:flex;justify-content:space-between"><span>⬇ Under</span><span style="color:var(--blue);font-weight:700">${Math.round(un/tot*100)}%</span></div></div>`;})():`
    <div class="pr">
      ${[m.home,"Empate",m.away].map(opt=>`<button class="pb ${pred&&pred.winner===opt?"on":""}" onclick="doPred(${m.id},'winner','${opt.replace(/'/g,"\\'")}')">
        <span class="pl">${opt==="Empate"?"Empate":"Ganador"}</span>
        <span class="pv">${FL[opt]||opt}</span>
      </button>`).join("")}
    </div>
    <div class="our">
      <button class="ob ${pred&&pred.over_under==="over"?"on":""}" onclick="doPred(${m.id},'over_under','over')">⬆ Over ${m.ou_line||2.5}</button>
      <button class="ob ${pred&&pred.over_under==="under"?"on":""}" onclick="doPred(${m.id},'over_under','under')">⬇ Under ${m.ou_line||2.5}</button>
    </div>`}
  </div>`;
};

const doPred=async(matchId,field,value)=>{
  const m=matches.find(x=>x.id===matchId);
  if(!m||isStarted(m))return;if(!curGroup){showToast('⚠️ Únete a un grupo primero para predecir','error');return;}
  const uid=profile.id;
  const existing=(preds[uid]&&preds[uid][matchId])||{};
  const np=Object.assign({},existing,{user_id:uid,match_id:matchId,updated_at:new Date().toISOString()});
  np[field]=value;
  if(!preds[uid])preds[uid]={};
  preds[uid][matchId]=np;
  // Re-render just the match card
  renderApp();
  await api(S+"/rest/v1/predictions?on_conflict=user_id,match_id",tok(),{method:"POST",headers:{"Prefer":"return=representation,resolution=merge-duplicates"},body:JSON.stringify(np)});
  showToast("Guardado ✓");
};

const getLeaderboard=()=>members.map(uid=>{
  const up=preds[uid]||{};let p=0,c=0,tot=0;
  matches.forEach(m=>{if(m.home_score!=null&&up[m.id]){const pt=pts(up[m.id],m);if(pt!=null){p+=pt;tot++;if(pt>0)c++;}}});
  return{uid,pts:p,correct:c,total:tot,prof:mProfs[uid]};
}).sort((a,b)=>b.pts-a.pts);

const updateTeam=async(id,field,val)=>{
  const body={};body[field]=val;
  await api(S+"/rest/v1/matches?id=eq."+id,tok(),{method:"PATCH",body:JSON.stringify(body)});
  const idx=matches.findIndex(m=>m.id===id);
  if(idx>=0)matches[idx][field]=val;
  showToast("Actualizado ✓");
};

const saveResult=async(id)=>{
  const hs=$("hs"+id),as=$("as"+id);
  if(!hs||!as||hs.value===""||as.value==="")return;
  await api(S+"/rest/v1/matches?id=eq."+id,tok(),{method:"PATCH",body:JSON.stringify({home_score:parseInt(hs.value),away_score:parseInt(as.value),started:true})});
  const idx=matches.findIndex(m=>m.id===id);
  if(idx>=0){matches[idx].home_score=parseInt(hs.value);matches[idx].away_score=parseInt(as.value);matches[idx].started=true;}
  showToast("Resultado guardado ✓");
  renderApp();
};

const saveOU=async(id)=>{   const v=document.getElementById("ou"+id);   if(!v)return;   await api(S+"/rest/v1/matches?id=eq."+id,tok(),{method:"PATCH",body:JSON.stringify({ou_line:parseFloat(v.value)})});   const idx=matches.findIndex(m=>m.id===id);   if(idx>=0)matches[idx].ou_line=parseFloat(v.value);   showToast("O/U actualizado ✓"); };
const clearResult=async(id)=>{await api(S+"/rest/v1/matches?id=eq."+id,tok(),{method:"PATCH",body:JSON.stringify({home_score:null,away_score:null})});
  const idx=matches.findIndex(m=>m.id===id);
  if(idx>=0){matches[idx].home_score=null;matches[idx].away_score=null;}
  renderApp();
};

      <div style="display:flex;gap:8px"><button class="btn bg" style="flex:1" onclick="saveProfile()">Guardar</button><button class="btn bo" style="flex:1" onclick="modal=null;renderApp()">Cancelar</button></div>
    </div></div>`;
  } else if(modal==="newGroup"){
    ma.innerHTML=`<div class="mo" onclick="if(event.target===this){modal=null;renderApp()}"><div class="md">
      <div class="mt">Crear Grupo</div>
      <div class="ig" style="margin-bottom:14px"><label class="il">Nombre del grupo</label><input class="inf" id="gn" placeholder="Ej: Familia, Trabajo, Amigos..."/></div>
      <p style="font-size:12px;color:var(--text3);margin-bottom:14px">Se genera un código automático para invitar amigos.</p>
      <div style="display:flex;gap:8px"><button class="btn bg" style="flex:1" onclick="createGroup()">Crear</button><button class="btn bo" style="flex:1" onclick="modal=null;renderApp()">Cancelar</button></div>
    </div></div>`;
    setTimeout(()=>{const i=$("gn");if(i)i.onkeydown=e=>{if(e.key==="Enter")createGroup();};},50);
  } else if(modal==="joinGroup"){
    ma.innerHTML=`<div class="mo" onclick="if(event.target===this){modal=null;renderApp()}"><div class="md">
      <div class="mt">Unirme a Grupo</div>
      <div class="ig" style="margin-bottom:14px"><label class="il">Código de invitación</label><input class="inf" id="jc" placeholder="Ej: a1b2c3d4" style="letter-spacing:3px;text-transform:uppercase;font-family:'Bebas Neue',cursive;font-size:22px"/></div>
      <p style="font-size:12px;color:var(--text3);margin-bottom:14px">Pídele el código al admin del grupo.</p>
      <div style="display:flex;gap:8px"><button class="btn bg" style="flex:1" onclick="joinGroup()">Unirme</button><button class="btn bo" style="flex:1" onclick="modal=null;renderApp()">Cancelar</button></div>
    </div></div>`;
    setTimeout(()=>{const i=$("jc");if(i)i.onkeydown=e=>{if(e.key==="Enter")joinGroup();};},50);
  }
};

const openProfile=()=>{modal="profile";renderApp();};

const saveProfile=async()=>{
  const n=$("en").value,a=$("eav").value;
  if(!n.trim())return;
  await api(S+"/rest/v1/profiles?id=eq."+profile.id,tok(),{method:"PATCH",body:JSON.stringify({name:n,avatar:a||profile.avatar})});
  profile.name=n;profile.avatar=a||profile.avatar;
  modal=null;showToast("Perfil actualizado ✓");renderApp();
};

const createGroup=async()=>{
  const n=$("gn");
  if(!n||!n.value.trim())return;
  const r=await api(S+"/rest/v1/rpc/create_group",tok(),{method:"POST",body:JSON.stringify({group_name:n.value.trim(),user_id:profile.id})});
  if(Array.isArray(r)&&r[0]){
    await api(S+"/rest/v1/group_members",tok(),{method:"POST",body:JSON.stringify({group_id:r[0].id,user_id:profile.id})});
    groups.push(r[0]);curGroup=r[0];modal=null;page="matches";
    await loadGroupData(r[0].id);
    showToast("Grupo \""+r[0].name+"\" creado 🎉");renderApp();
  } else showToast("Error al crear","error");
};

const joinGroup=async()=>{
  const c=$("jc");
  if(!c||!c.value.trim())return;
 const found=await api(S+"/rest/v1/rpc/find_group_by_invite",tok(),{method:"POST",body:JSON.stringify({code:c.value.trim().toLowerCase()})});
  if(!Array.isArray(found)||!found[0]){showToast("Código inválido","error");return;}
  const g=found[0];
  await api(S+"/rest/v1/group_members",tok(),{method:"POST",body:JSON.stringify({group_id:g.id,user_id:profile.id})});
  if(!groups.find(x=>x.id===g.id))groups.push(g);
  curGroup=g;modal=null;page="matches";
  await loadGroupData(g.id);
  showToast("¡Te uniste a "+g.name+"!");renderApp();
};

const doLogout=()=>{saveS(null);session=null;profile=null;curGroup=null;groups=[];matches=[];preds={};members=[];render();};

// INIT
(async()=>{
  session=loadS();if(session&&session.access_token&&(!session.user||!session.user.id)){saveS(null);session=null;}
  if(session&&session.access_token){
 const to=new Promise((_,r)=>setTimeout(()=>r("timeout"),8000));
    try{await Promise.race([initApp(),to]);}
    catch(e){saveS(null);session=null;}
  }
  render();
})();
</script>
</body>
